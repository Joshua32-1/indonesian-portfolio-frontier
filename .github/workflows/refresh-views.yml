name: Capture Analyst Views

# Weekly point-in-time capture of analyst price targets (forwardEstimates) + caps + rf
# into portfolio-app/data/view-history/. Prices are reconstructible from price history,
# so these views are the only non-reconstructible input a future full-strategy
# (analyst-view) κ-replay needs. Capturing weekly keeps the finest replay grid open.

on:
  # Sundays at 11:00 UTC = 18:00 WIB; one capture per week, aligned with the
  # weekly rebalance run (and an hour before it).
  schedule:
    - cron: '0 11 * * 0'
  # Allow manual trigger from GitHub UI.
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portfolio-app/package-lock.json

      - name: Install optimizer deps
        working-directory: portfolio-app
        run: npm ci

      # Pinned universe — the archive is forward-test provenance, so it must cover
      # exactly FORWARD_TEST_UNIVERSE_JK. (fetch-snapshot.js only writes view-history
      # in --forward-test mode, so a research fetch can't claim the week's slot.)
      - name: Fetch rich snapshot (pinned universe; writes trimmed view-history)
        working-directory: portfolio-app
        run: npm run fetch-snapshot:forward
        env:
          NODE_OPTIONS: '--max-old-space-size=512'

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio-app/data/view-history/
          if git diff --staged --quiet; then
            echo "No new analyst views — skipping commit"
          else
            git commit -m "chore: capture analyst views $(date -u +%Y-%m-%d)"
            git push
          fi
