name: Refresh Backtest Results

on:
  # Weekly, Sunday 12:00 UTC = 19:00 WIB. The full sweep is heavy (~45–60 min),
  # so it runs once a week rather than daily like the dashboard snapshot.
  schedule:
    - cron: '0 12 * * 0'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backtest-portfolio/package-lock.json

      - name: Install backtest deps
        working-directory: backtest-portfolio
        run: npm ci

      # Rebuilds public/backtest-history.json (gitignored, ~3 MB) on the runner.
      # The fetch universe comes from portfolio-app/data/universe.js (single source).
      - name: Fetch full IDX backtest history
        working-directory: backtest-portfolio
        run: npm run fetch
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      # Full sweep: cap prior, weekly+monthly+quarterly, all tail-λ variants + κ-sweep
      # → public/backtest-results.json. Per-prior variant files (…-shrunk / …-equal)
      # are separate env-driven runs and intentionally NOT regenerated here; add them
      # as a job matrix later if the weekly run should cover them too.
      - name: Run strategy backtest (full sweep)
        working-directory: backtest-portfolio
        run: npm run backtest
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      # Commit only the results (history is gitignored/regenerable).
      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest-portfolio/public/backtest-results.json
          if git diff --staged --quiet; then
            echo "No backtest changes — skipping commit"
          else
            git commit -m "chore: refresh backtest results $(date -u +%Y-%m-%d)"
            git push
          fi
