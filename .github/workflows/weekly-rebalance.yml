name: Weekly Rebalance

# Re-runs the optimizer headlessly every Sunday and commits new portfolios.json
# weights DIRECTLY to main (no PR), ready before Monday's market open — the push
# redeploys Vercel automatically.
#
# Matrix design: the forward test tracks a methodology matrix (PERT + BL×prior×τ).
# Each config runs as its own parallel job that writes ONLY its streams to an emit
# artifact (`optimize.mjs --emit`), then a single merge job assembles them into
# portfolios.json and pushes to main — so parallel jobs never clobber the shared file.
#
# COST: the weekly matrix runs the FULL 10-config set (pert + BL × prior{cap,shrunk,equal}
# × τ{0.01,0.03,0.10}). Each job emits only its 6 κ=0 target streams; the merge step then
# κ-expands every stream into the 5-κ axis {0,0.1,0.25,0.5,0.75} → 300 streams. κ is a cheap
# post-hoc blend (no extra optimizer runs), so cost scales with configs (10), not configs×κ.
#
# GUARDRAIL: no human review gate — merge-rebalances.mjs FAILS the job (no push) if any
# weight map doesn't sum to ~1 or references an unknown ticker/stream id, so malformed
# weights never reach production. Review the auto-commit on main after the fact.

on:
  schedule:
    - cron: '0 12 * * 0'   # Sundays 12:00 UTC = 19:00 WIB (fetches Friday close)
  workflow_dispatch:
    inputs:
      effective:
        description: 'Effective date (YYYY-MM-DD). Blank = run date.'
        required: false
        default: ''
      paths:
        description: 'Optimizer paths (fidelity). Blank = config default (10000).'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # ~80 min/config at 100k iter / 10k paths
    strategy:
      fail-fast: false
      matrix:
        config:
          - { tag: pert,          methodology: pert, prior: '',      tau: '' }
          - { tag: bl-cap-t01,    methodology: bl,   prior: cap,     tau: '0.01' }
          - { tag: bl-cap-t03,    methodology: bl,   prior: cap,     tau: '0.03' }
          - { tag: bl-cap-t10,    methodology: bl,   prior: cap,     tau: '0.10' }
          - { tag: bl-shrunk-t01, methodology: bl,   prior: shrunk,  tau: '0.01' }
          - { tag: bl-shrunk-t03, methodology: bl,   prior: shrunk,  tau: '0.03' }
          - { tag: bl-shrunk-t10, methodology: bl,   prior: shrunk,  tau: '0.10' }
          - { tag: bl-equal-t01,  methodology: bl,   prior: equal,   tau: '0.01' }
          - { tag: bl-equal-t03,  methodology: bl,   prior: equal,   tau: '0.03' }
          - { tag: bl-equal-t10,  methodology: bl,   prior: equal,   tau: '0.10' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portfolio-app/package-lock.json
      - name: Install optimizer deps
        working-directory: portfolio-app
        run: npm ci
      # PINNED universe: --forward-test builds the snapshot from FORWARD_TEST_UNIVERSE_JK,
      # not the research list UNIVERSE_JK, so research edits never move production.
      - name: Fetch fresh optimizer snapshot (Yahoo + BI-Rate, pinned universe)
        working-directory: portfolio-app
        run: npm run fetch-snapshot:forward
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'
      - name: Optimize ${{ matrix.config.tag }} → emit artifact
        working-directory: portfolio-app
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/emit"
          ARGS="--methodology ${{ matrix.config.methodology }} --emit $GITHUB_WORKSPACE/emit/weights-${{ matrix.config.tag }}.json"
          [ -n "${{ github.event.inputs.effective }}" ] && ARGS="$ARGS --effective ${{ github.event.inputs.effective }}"
          [ -n "${{ github.event.inputs.paths }}" ] && ARGS="$ARGS --paths ${{ github.event.inputs.paths }}"
          if [ "${{ matrix.config.methodology }}" = "bl" ]; then
            ARGS="$ARGS --prior-mode ${{ matrix.config.prior }} --tau ${{ matrix.config.tau }}"
          fi
          echo "optimize.mjs $ARGS"
          node scripts/optimize.mjs $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: weights-${{ matrix.config.tag }}
          path: emit/weights-${{ matrix.config.tag }}.json
          retention-days: 3

  merge:
    needs: optimize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download all config emit artifacts
        uses: actions/download-artifact@v4
        with:
          path: emit
          pattern: weights-*
          merge-multiple: true
      - name: Merge emit artifacts → portfolios.json (+ κ-expand)
        run: node live-dashboard-portfolio/scripts/merge-rebalances.mjs emit/*.json
      - name: Commit & push weights to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- live-dashboard-portfolio/data/portfolios.json; then
            echo "No weight changes — nothing to push."; exit 0
          fi
          # Rebase onto latest main in case daily snapshot commits landed since checkout.
          git pull --rebase --autostash origin main
          git add live-dashboard-portfolio/data/portfolios.json
          git commit -m "chore: weekly rebalance weights (methodology matrix × κ, run ${GITHUB_RUN_ID})"
          git push origin HEAD:main
