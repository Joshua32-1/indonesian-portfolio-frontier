name: Weekly Rebalance PR

# Re-runs the optimizer headlessly every Sunday and opens ONE PR with new
# portfolios.json weights for human review, ready before Monday's market open.
# Nothing reaches production until the PR is merged (which redeploys Vercel).
#
# Matrix design: the forward test tracks a methodology matrix (PERT + BL×prior×τ).
# Each config runs as its own parallel job that writes ONLY its streams to an emit
# artifact (`optimize.mjs --emit`), then a single merge job assembles them into
# portfolios.json and opens the PR — so parallel jobs never clobber the shared file.
#
# COST: the weekly matrix is the HEADLINE subset (pert + BL cap × τ-sweep = 4 configs)
# to stay within CI minutes. Re-seed the FULL 10-config matrix occasionally via the
# local `scripts/seed-forward-matrix.mjs`, or extend `matrix.config` below + dispatch.
#
# Requires repo setting: Settings → Actions → General → Workflow permissions →
# "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: '0 12 * * 0'   # Sundays 12:00 UTC = 19:00 WIB (fetches Friday close)
  workflow_dispatch:
    inputs:
      effective:
        description: 'Effective date (YYYY-MM-DD). Blank = run date.'
        required: false
        default: ''
      paths:
        description: 'Optimizer paths (fidelity). Blank = config default (10000).'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # ~80 min/config at 100k iter / 10k paths
    strategy:
      fail-fast: false
      matrix:
        config:
          - { tag: pert,       methodology: pert, prior: '',    tau: '' }
          - { tag: bl-cap-t01, methodology: bl,   prior: cap,   tau: '0.01' }
          - { tag: bl-cap-t03, methodology: bl,   prior: cap,   tau: '0.03' }
          - { tag: bl-cap-t10, methodology: bl,   prior: cap,   tau: '0.10' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portfolio-app/package-lock.json
      - name: Install optimizer deps
        working-directory: portfolio-app
        run: npm ci
      - name: Fetch fresh optimizer snapshot (Yahoo + BI-Rate)
        working-directory: portfolio-app
        run: npm run fetch-snapshot
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'
      - name: Optimize ${{ matrix.config.tag }} → emit artifact
        working-directory: portfolio-app
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/emit"
          ARGS="--methodology ${{ matrix.config.methodology }} --emit $GITHUB_WORKSPACE/emit/weights-${{ matrix.config.tag }}.json"
          [ -n "${{ github.event.inputs.effective }}" ] && ARGS="$ARGS --effective ${{ github.event.inputs.effective }}"
          [ -n "${{ github.event.inputs.paths }}" ] && ARGS="$ARGS --paths ${{ github.event.inputs.paths }}"
          if [ "${{ matrix.config.methodology }}" = "bl" ]; then
            ARGS="$ARGS --prior-mode ${{ matrix.config.prior }} --tau ${{ matrix.config.tau }}"
          fi
          echo "optimize.mjs $ARGS"
          node scripts/optimize.mjs $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: weights-${{ matrix.config.tag }}
          path: emit/weights-${{ matrix.config.tag }}.json
          retention-days: 3

  merge:
    needs: optimize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download all config emit artifacts
        uses: actions/download-artifact@v4
        with:
          path: emit
          pattern: weights-*
          merge-multiple: true
      - name: Merge emit artifacts → portfolios.json
        run: node live-dashboard-portfolio/scripts/merge-rebalances.mjs emit/*.json
      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: live-dashboard-portfolio/data/portfolios.json
          branch: auto/weekly-rebalance
          delete-branch: true
          commit-message: 'chore: weekly rebalance weights (methodology matrix)'
          title: 'Weekly rebalance — review new weights'
          body: |
            Automated weekly rebalance — methodology matrix (PERT + BL cap×τ headline subset),
            produced by `portfolio-app/scripts/optimize.mjs --emit` + `merge-rebalances.mjs`.

            **Review before merging:**
            - Check the per-stream weight diff (ids `<base>@<configTag>`).
            - Each stream's weights sum to ~1.00 (enforced by the merge script).
            - Merging redeploys the Vercel dashboard with the new `effective` weights.

            See [`FORWARD-TEST.md`](../blob/main/FORWARD-TEST.md) for the protocol.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
